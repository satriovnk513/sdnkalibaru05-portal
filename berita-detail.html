<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detail Berita dan Pengumuman Resmi SDN Kalibaru 05 Pagi.">
    <title>Detail Berita - SDN Kalibaru 05 Pagi</title>
    <link rel="icon" type="image/x-icon" href="https://wwpbghdepykfqgzhyvmh.supabase.co/storage/v1/object/public/photos/logo.ico">
    <link rel="icon" type="image/png" sizes="48x48" href="https://wwpbghdepykfqgzhyvmh.supabase.co/storage/v1/object/public/photos/logo-baru.png">
    <link rel="icon" type="image/png" sizes="96x96" href="https://wwpbghdepykfqgzhyvmh.supabase.co/storage/v1/object/public/photos/logo-baru.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://wwpbghdepykfqgzhyvmh.supabase.co/storage/v1/object/public/photos/logo-baru.png">
    <link rel="shortcut icon" href="https://wwpbghdepykfqgzhyvmh.supabase.co/storage/v1/object/public/photos/logo.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="https://wwpbghdepykfqgzhyvmh.supabase.co/storage/v1/object/public/photos/logo-baru.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        .news-detail-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 8rem 1.5rem 4rem;
        }

        .news-breadcrumb {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 2rem;
        }
        .news-breadcrumb a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .news-breadcrumb a:hover {
            text-decoration: underline;
        }

        .news-detail-header {
            margin-bottom: 2.5rem;
        }
        .news-detail-date {
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 1rem;
            background: rgba(218, 37, 28, 0.08);
            padding: 0.35rem 1rem;
            border-radius: var(--radius-full);
        }
        .news-detail-title {
            font-family: var(--font-heading);
            font-size: 2.4rem;
            line-height: 1.25;
            color: var(--text-main);
            margin-bottom: 0;
            letter-spacing: -0.02em;
        }

        .news-detail-separator {
            width: 60px;
            height: 4px;
            background: linear-gradient(135deg, var(--primary-color), #f43f5e);
            border-radius: 2px;
            margin: 2rem 0;
        }

        .news-detail-img {
            width: 100%;
            height: auto;
            max-height: 480px;
            object-fit: cover;
            border-radius: var(--radius-md);
            margin-bottom: 2.5rem;
            box-shadow: var(--shadow-lg);
        }

        .news-detail-content {
            font-size: 1.05rem;
            line-height: 2;
            color: #334155;
            margin-bottom: 2.5rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .pdf-attachment-card {
            background: linear-gradient(135deg, #fef2f2, #fff1f2);
            border: 1px solid rgba(218, 37, 28, 0.15);
            border-radius: var(--radius-md);
            padding: 1.75rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .pdf-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 0;
        }
        .pdf-icon-wrapper {
            width: 52px;
            height: 52px;
            background: #da251c;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .pdf-icon-wrapper i {
            font-size: 1.5rem;
            color: white;
        }
        .pdf-text {
            min-width: 0;
        }
        .pdf-text h4 {
            margin-bottom: 0.2rem;
            font-size: 1rem;
            color: var(--text-main);
        }
        .pdf-text p {
            color: var(--text-light);
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }
        .btn-download-pdf {
            background: var(--primary-color);
            color: white;
            padding: 0.7rem 1.5rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .btn-download-pdf:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            color: white;
        }

        .back-link-section {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2.5rem;
            border-top: 1px solid var(--border-color);
        }

        .loading-skeleton {
            text-align: center;
            padding: 8rem 0;
        }
        .error-message {
            text-align: center;
            padding: 8rem 0;
        }
        .error-message h2 {
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }
        .error-message p {
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .news-detail-container {
                padding: 6rem 1rem 3rem;
            }
            .news-detail-title {
                font-size: 1.6rem;
            }
            .pdf-attachment-card {
                flex-direction: column;
                text-align: center;
                padding: 1.5rem;
            }
            .pdf-info {
                flex-direction: column;
            }
            .pdf-text p {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav id="navbar">
        <div class="nav-container">
            <a href="/" class="logo-container">
                <img src="https://wwpbghdepykfqgzhyvmh.supabase.co/storage/v1/object/public/photos/logo-baru.png" alt="Logo SDN Kalibaru 05 Pagi" class="logo-img">
                <span class="logo-text">SDN Kalibaru 05</span>
            </a>
            <div class="menu-toggle" id="mobile-menu">
                <i class="fas fa-bars"></i>
            </div>
            <ul class="nav-links">
                <li><a href="/">Beranda</a></li>
                <li><a href="profil">Profil</a></li>
                <li><a href="guru-staff">Guru & Staf</a></li>
                <li><a href="ekstrakurikuler">Ekstrakurikuler</a></li>
                <li><a href="berita" class="active">Berita & Pengumuman</a></li>
                <li class="has-dropdown">
                    <a href="#">Internal <i class="fas fa-chevron-down"></i></a>
                    <ul class="dropdown-menu">
                        <li><a href="https://dapodik.sdnkalibaru05.sch.id" target="_blank">Dapodik</a></li>
                        <li><a href="https://erapor.sdnkalibaru05.sch.id" target="_blank">E-Rapor</a></li>
                    </ul>
                </li>
                <li><a href="admin"><i class="fas fa-edit"></i> Admin</a></li>
                <li class="nav-right-start"><a href="https://www.instagram.com/sdnkalibaru05/" target="_blank"><i class="fab fa-instagram" style="margin-right: 5px;"></i>Foto Galeri</a></li>
                <li><a href="kontak" class="btn-primary-outline">Kontak Kami</a></li>
            </ul>
        </div>
    </nav>

    <main class="news-detail-container" id="newsDetail">
        <div class="loading-skeleton">
            <i class="fas fa-circle-notch fa-spin fa-3x" style="color: var(--primary-color);"></i>
            <p style="margin-top: 1rem;">Memuat isi berita...</p>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 SDN Kalibaru 05 Pagi. All rights reserved.</p>
                <div class="social-links">
                    <a href="https://www.facebook.com/profile.php?id=100083701537155" target="_blank"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://www.instagram.com/sdnkalibaru05/" target="_blank"><i class="fab fa-instagram"></i></a>
                    <a href="https://www.youtube.com/@sdnkalibaru05jakarta57" target="_blank"><i class="fab fa-youtube"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const newsId = urlParams.get('id');
            const newsSlug = urlParams.get('slug');
            const container = document.getElementById('newsDetail');

            if (!newsId && !newsSlug) {
                container.innerHTML = '<div class="error-message"><h2>Berita tidak ditemukan</h2><p>Parameter berita tidak valid.</p><a href="/berita" class="btn-primary" style="display: inline-block;">Kembali ke Berita</a></div>';
                return;
            }

            try {
                let query = supabaseClient.from('news').select('*');
                
                if (newsSlug) {
                    query = query.eq('slug', newsSlug);
                } else {
                    query = query.eq('id', newsId);
                }

                const { data: news, error } = await query.single();

                if (error || !news) throw error || new Error('Berita tidak ditemukan');

                // Update Page Title
                document.title = `${news.title} - SDN Kalibaru 05 Pagi`;

                // PDF Attachment
                let pdfHtml = '';
                if (news.pdf_url) {
                    const displayFilename = news.pdf_filename || `${news.title}.pdf`;
                    pdfHtml = `
                        <div class="pdf-attachment-card animate-up">
                            <div class="pdf-info">
                                <div class="pdf-icon-wrapper">
                                    <i class="fas fa-file-pdf"></i>
                                </div>
                                <div class="pdf-text">
                                    <h4>Lampiran Dokumen</h4>
                                    <p title="${displayFilename}">${displayFilename}</p>
                                </div>
                            </div>
                            <a href="${news.pdf_url}" target="_blank" class="btn-download-pdf">
                                <i class="fas fa-external-link-alt"></i> Buka PDF
                            </a>
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="news-breadcrumb animate-up">
                        <a href="/">Beranda</a> / <a href="/berita">Berita & Pengumuman</a> / ${news.title}
                    </div>

                    <div class="news-detail-header animate-up">
                        <span class="news-detail-date"><i class="far fa-calendar-alt" style="margin-right: 5px;"></i> ${news.date}</span>
                        <h1 class="news-detail-title">${news.title}</h1>
                    </div>

                    <div class="news-detail-separator animate-up"></div>

                    <img src="${news.image_url}" alt="${news.title}" class="news-detail-img animate-up" onerror="this.style.display='none';">

                    <div class="news-detail-content animate-up">
${news.content || news.description || 'Tidak ada konten tambahan.'}
                    </div>

                    ${pdfHtml}

                    <div class="back-link-section animate-up">
                        <a href="/berita" class="btn-primary-outline"><i class="fas fa-arrow-left"></i> Kembali ke Semua Berita</a>
                    </div>
                `;

                // Trigger animations for dynamically loaded content
                setTimeout(() => {
                    container.querySelectorAll('.animate-up').forEach(el => {
                        el.classList.add('show');
                    });
                }, 100);

            } catch (err) {
                console.error('Error fetching news detail:', err);
                container.innerHTML = `<div class="error-message"><h2>Berita tidak ditemukan</h2><p>${err.message || 'Data tidak ditemukan di database.'}</p><a href="/berita" class="btn-primary" style="display: inline-block;">Kembali ke Berita</a></div>`;
            }
        });
    </script>
    <script src="/main.js"></script>
</body>
</html>
