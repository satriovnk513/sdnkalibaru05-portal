<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detail Berita dan Pengumuman Resmi SDN Kalibaru 05 Pagi.">
    <title>Detail Berita - SDN Kalibaru 05 Pagi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        .news-detail-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 8rem 1.5rem 4rem;
        }

        .news-breadcrumb {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 2rem;
        }
        .news-breadcrumb a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .news-breadcrumb a:hover {
            text-decoration: underline;
        }

        .news-detail-header {
            margin-bottom: 2.5rem;
        }
        .news-detail-date {
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 1rem;
            background: rgba(218, 37, 28, 0.08);
            padding: 0.35rem 1rem;
            border-radius: var(--radius-full);
        }
        .news-detail-title {
            font-family: var(--font-heading);
            font-size: 2.4rem;
            line-height: 1.25;
            color: var(--text-main);
            margin-bottom: 0;
            letter-spacing: -0.02em;
        }

        .news-detail-separator {
            width: 60px;
            height: 4px;
            background: linear-gradient(135deg, var(--primary-color), #f43f5e);
            border-radius: 2px;
            margin: 2rem 0;
        }

        .news-detail-img {
            width: 100%;
            height: auto;
            max-height: 480px;
            object-fit: cover;
            border-radius: var(--radius-md);
            margin-bottom: 2.5rem;
            box-shadow: var(--shadow-lg);
        }

        /* Multi-image gallery */
        .news-img-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }
        .news-img-gallery.single {
            grid-template-columns: 1fr;
        }
        .news-img-gallery img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .news-img-gallery.single img {
            max-height: 480px;
            height: auto;
        }
        .news-img-gallery img:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-lg);
        }

        /* Lightbox */
        .lightbox-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .lightbox-overlay.open { display: flex; }
        .lightbox-overlay img {
            max-width: 92vw;
            max-height: 88vh;
            border-radius: 10px;
            object-fit: contain;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }
        .lightbox-close {
            position: fixed;
            top: 1rem;
            right: 1.25rem;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
            background: none;
            border: none;
        }

        /* Multi-PDF list */
        .pdf-attachments-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .news-detail-content {
            font-size: 1.05rem;
            line-height: 2;
            color: #334155;
            margin-bottom: 2.5rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .pdf-attachment-card {
            background: linear-gradient(135deg, #fef2f2, #fff1f2);
            border: 1px solid rgba(218, 37, 28, 0.15);
            border-radius: var(--radius-md);
            padding: 1.75rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .pdf-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 0;
        }
        .pdf-icon-wrapper {
            width: 52px;
            height: 52px;
            background: #da251c;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .pdf-icon-wrapper i {
            font-size: 1.5rem;
            color: white;
        }
        .pdf-text {
            min-width: 0;
        }
        .pdf-text h4 {
            margin-bottom: 0.2rem;
            font-size: 1rem;
            color: var(--text-main);
        }
        .pdf-text p {
            color: var(--text-light);
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }
        .btn-download-pdf {
            background: var(--primary-color);
            color: white;
            padding: 0.7rem 1.5rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .btn-download-pdf:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            color: white;
        }

        .back-link-section {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2.5rem;
            border-top: 1px solid var(--border-color);
        }

        .loading-skeleton {
            text-align: center;
            padding: 8rem 0;
        }
        .error-message {
            text-align: center;
            padding: 8rem 0;
        }
        .error-message h2 {
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }
        .error-message p {
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        @media (max-width: 768px) {
            .news-detail-container {
                padding: 6rem 1rem 3rem;
            }
            .news-detail-title {
                font-size: 1.6rem;
            }
            .pdf-attachment-card {
                flex-direction: column;
                text-align: center;
                padding: 1.5rem;
            }
            .pdf-info {
                flex-direction: column;
            }
            .pdf-text p {
                max-width: 100%;
            }
        }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
</head>
<body>

        <div class="nav-container">

                <img src="https://wwpbghdepykfqgzhyvmh.supabase.co/storage/v1/object/public/photos/logo-baru.png" alt="Logo SDN Kalibaru 05 Pagi" class="logo-img">
                <span class="logo-text">SDN Kalibaru 05</span>
            </a>
            <div class="menu-toggle" id="mobile-menu">
                <i class="fas fa-bars"></i>
            </div>
            <ul class="nav-links">
                <li><a href="/">Beranda</a></li>

                <li><a href="ekstrakurikuler">Ekstrakurikuler</a></li>
                <li><a href="berita" class="active">Berita & Pengumuman</a></li>

                    <a href="#">Internal <i class="fas fa-chevron-down"></i></a>

    <main class="news-detail-container" id="newsDetail">
        <div class="loading-skeleton">
            <i class="fas fa-circle-notch fa-spin fa-3x" style="color: var(--primary-color);"></i>

        </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 SDN Kalibaru 05 Pagi. All rights reserved.</p>
                <div class="social-links">
                    <a href="https://www.facebook.com/profile.php?id=100083701537155" target="_blank"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://www.instagram.com/sdnkalibaru05/" target="_blank"><i class="fab fa-instagram"></i></a>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const newsId = urlParams.get('id');
            let newsSlug = urlParams.get('slug'); // Add slug support
            
            // Fallback: if slug is not in query params, try to get it from pathname (for /berita/slug URLs)
            if (!newsSlug && window.location.pathname.includes('/berita/')) {
                const parts = window.location.pathname.split('/').filter(p => p !== '');
                newsSlug = parts[parts.length - 1];
            }

            const container = document.getElementById('newsDetail');

            if (!newsId && !newsSlug) {
                container.innerHTML = '<div class="error-message"><h2>Berita tidak ditemukan</h2><p>Parameter berita tidak valid.</p><a href="/berita" class="btn-primary" style="display: inline-block;">Kembali ke Berita</a></div>';
                return;
            }

            try {
                let query = supabaseClient.from('news').select('*');
                
                if (newsSlug) {
                    query = query.ilike('slug', newsSlug); // Case-insensitive matching
                } else {
                    query = query.eq('id', newsId);
                }

                const { data: news, error } = await query.maybeSingle();

                if (error) throw error;
                if (!news) throw new Error(`Berita dengan tautan "${newsSlug}" tidak ditemukan di database kami.`);

                // Update Page Title
                document.title = `${news.title} - SDN Kalibaru 05 Pagi`;

                // Build image gallery (multiple or single)
                const allImages = (Array.isArray(news.image_urls) && news.image_urls.length > 0)
                    ? news.image_urls
                    : (news.image_url ? [news.image_url] : []);

                let galleryHtml = '';
                if (allImages.length > 0) {
                    const isSingle = allImages.length === 1;
                    galleryHtml = `<div class="news-img-gallery animate-up ${isSingle ? 'single' : ''}">`;
                    allImages.forEach((url, idx) => {
                        galleryHtml += `<img src="${url}" alt="Gambar ${idx + 1} - ${news.title}" onclick="openLightbox('${url}')" onerror="this.closest('.news-img-gallery') && (this.style.display='none')">` ;
                    });
                    galleryHtml += `</div>`;
                }

                // Build PDF attachments list (multiple or single)
                const allPdfs = (Array.isArray(news.pdf_attachments) && news.pdf_attachments.length > 0)
                    ? news.pdf_attachments
                    : (news.pdf_url ? [{ url: news.pdf_url, filename: news.pdf_filename || news.title + '.pdf' }] : []);

                let pdfHtml = '';
                if (allPdfs.length > 0) {
                    pdfHtml = `<div class="pdf-attachments-wrapper animate-up">`;
                    allPdfs.forEach(att => {
                        const displayFilename = att.filename || `${news.title}.pdf`;
                        pdfHtml += `
                        <div class="pdf-attachment-card">
                            <div class="pdf-info">
                                <div class="pdf-icon-wrapper"><i class="fas fa-file-pdf"></i></div>
                                <div class="pdf-text">
                                    <h4>Lampiran Dokumen</h4>
                                    <p title="${displayFilename}">${displayFilename}</p>
                                </div>
                            </div>
                            <a href="${att.url}" target="_blank" class="btn-download-pdf">
                                <i class="fas fa-external-link-alt"></i> Buka PDF
                            </a>
                        </div>`;
                    });
                    pdfHtml += `</div>`;
                }

                container.innerHTML = `
                    <div class="news-breadcrumb animate-up">
                        <a href="/">Beranda</a> / <a href="/berita">Berita &amp; Pengumuman</a> / ${news.title}
                    </div>

                    <div class="news-detail-header animate-up">
                        <span class="news-detail-date"><i class="far fa-calendar-alt" style="margin-right: 5px;"></i> ${news.date}</span>
                        <h1 class="news-detail-title">${news.title}</h1>
                    </div>

                    <div class="news-detail-separator animate-up"></div>

                    <!-- AI Action Card -->
                    <div style="background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 14px; padding: 1.25rem; margin-bottom: 2rem;" class="animate-up">
                        <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
                            <button onclick="summarizeCurrentNews()" style="background: #0284c7; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 0.88rem; display: flex; align-items: center; gap: 0.4rem;">
                                <i class="fas fa-magic"></i> Ringkas Berita (AI)
                            </button>
                            <button onclick="readNewsAudio()" style="background: #0d9488; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 0.88rem; display: flex; align-items: center; gap: 0.4rem;">
                                <i class="fas fa-volume-up"></i> Dengarkan Suara Berita
                            </button>
                        </div>
                        <div id="aiSummaryResult" style="margin-top: 1rem; display: none; font-size: 0.92rem; color: #0369a1; background: #ffffff; padding: 1rem; border-radius: 10px; border: 1px solid #e0f2fe; line-height: 1.6;"></div>
                    </div>

                    ${galleryHtml}

                    <div class="news-detail-content animate-up">
${news.content || news.description || 'Tidak ada konten tambahan.'}
                    </div>

                    ${pdfHtml}

                    <div class="back-link-section animate-up">
                        <a href="/berita" class="btn-primary-outline"><i class="fas fa-arrow-left"></i> Kembali ke Semua Berita</a>
                    </div>
                `;

                // Trigger animations for dynamically loaded content
                setTimeout(() => {
                    container.querySelectorAll('.animate-up').forEach(el => {
                        el.classList.add('show');
                    });
                }, 100);

            } catch (err) {
                console.error('Error fetching news detail:', err);
                container.innerHTML = `<div class="error-message"><h2>Berita tidak ditemukan</h2><p>${err.message || 'Data tidak ditemukan di database.'}</p><a href="/berita" class="btn-primary" style="display: inline-block;">Kembali ke Berita</a></div>`;
            }
        });
    </script>
    <!-- Lightbox overlay (for multi-image gallery) -->
    <div class="lightbox-overlay" id="lightboxOverlay" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()" title="Tutup">&times;</button>
        <img id="lightboxImg" src="" alt="Gambar besar">
    </div>

    <!-- AI Service & KaliBot -->
    <script src="/ai-service.js"></script>
    <script src="/kalibot.js"></script>
    <script src="/main.js"></script>
    <script>
        async function summarizeCurrentNews() {
            const box = document.getElementById('aiSummaryResult');
            box.style.display = 'block';
            box.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Sedang merangkum berita dengan AI...';
            try {
                const text = document.querySelector('.news-detail-content').innerText;
                const summary = await window.AIService.summarizeAIText(text);
                box.innerHTML = '<strong>📌 Ringkasan Poin AI:</strong><br>' + summary.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            } catch (e) {
                box.innerHTML = 'Gagal membuat ringkasan: ' + e.message;
            }
        }

        function readNewsAudio() {
            const text = document.querySelector('.news-detail-content').innerText;
            if (window.speakText) {
                window.speakText(text);
            }
        }

        function openLightbox(url) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightboxOverlay').classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            document.getElementById('lightboxOverlay').classList.remove('open');
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
    </script>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>

</body>
