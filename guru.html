<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#e11d48">
    <title>Portal Guru — SDN Kalibaru 05 Pagi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="attendance.css?v=1">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--att-bg); color: var(--att-ink); -webkit-text-size-adjust: 100%; }
        a { color: var(--att-brand); }
        .g-hidden { display: none !important; }

        /* Login */
        .g-login { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: 24px 16px; max-width: 420px; margin: 0 auto; }
        .g-login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
        .g-login-logo img { width: 52px; height: 52px; object-fit: contain; }
        .g-login-logo b { display: block; font-size: 1.05rem; }
        .g-login h1 { font-size: 1.6rem; font-weight: 800; margin: 0 0 4px; }
        .g-login form { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
        .g-pass { position: relative; }
        .g-pass .att-input { padding-right: 76px; }
        .g-pass button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); min-height: 36px; border: none; background: none; color: var(--att-muted); font-weight: 600; cursor: pointer; padding: 0 10px; }
        .g-login-foot { margin-top: 24px; text-align: center; }

        /* Shell */
        .g-top { position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 1px solid var(--att-line); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; }
        .g-top img { width: 32px; height: 32px; object-fit: contain; }
        .g-top-title { flex: 1 1 auto; min-width: 0; }
        .g-top-title b { display: block; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .g-top-title span { font-size: 0.76rem; color: var(--att-muted); }
        .g-back { min-width: 44px; min-height: 44px; border: none; background: #f1f5f9; border-radius: 12px; font-size: 1.2rem; cursor: pointer; }
        .g-main { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
        .g-main h2 { font-size: 1.15rem; margin: 22px 0 10px; }
        .g-main h2:first-child { margin-top: 0; }
        .g-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #fff; border-top: 1px solid var(--att-line); display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom); }
        .g-nav a { min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--att-muted); text-decoration: none; font-size: 0.74rem; font-weight: 600; }
        .g-nav a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .g-nav a[aria-current="page"] { color: var(--att-brand); }
        body.g-sheet-open .g-nav { display: none; }

        /* Kartu tugas */
        .g-task { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .g-task-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
        .g-task-head b { font-size: 1.05rem; }
        .g-task.todo { border-left: 4px solid var(--att-brand); }
        .g-task.done { border-left: 4px solid var(--att-h); }
        .g-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .g-chip { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--att-line); background: #fff; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--att-ink); text-decoration: none; }
        .g-chip.done { border-color: #bbf7d0; background: var(--att-h-bg); color: #166534; }
        .g-date-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }

        /* Profil siswa */
        .g-prof dl { display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr); gap: 8px 12px; margin: 0; font-size: 0.92rem; }
        .g-prof dt { color: var(--att-muted); }
        .g-prof dd { margin: 0; overflow-wrap: anywhere; }
        .g-prof h3 { font-size: 0.95rem; margin: 18px 0 8px; }
        .g-phone { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
        .g-loading { padding: 32px 0; text-align: center; color: var(--att-muted); }
    </style>
</head>
<body>
    <!-- Login -->
    <section class="g-login g-hidden" id="gLogin" aria-labelledby="gLoginTitle">
        <div class="g-login-logo">
            <img src="https://wwpbghdepykfqgzhyvmh.supabase.co/storage/v1/object/public/photos/logo-baru.png" alt="Logo SDN Kalibaru 05 Pagi" onerror="this.style.visibility='hidden'">
            <div><b>SDN Kalibaru 05 Pagi</b><span class="att-muted">Portal Guru</span></div>
        </div>
        <h1 id="gLoginTitle">Masuk</h1>
        <p class="att-muted" style="margin:0">Pakai email atau NIP/NUPTK dan password dari admin sekolah.</p>
        <form id="gLoginForm" novalidate>
            <div class="att-field">
                <label for="gId">Email atau NIP/NUPTK</label>
                <input class="att-input" id="gId" name="identifier" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>
            <div class="att-field">
                <label for="gPw">Password</label>
                <div class="g-pass">
                    <input class="att-input" id="gPw" name="password" type="password" autocomplete="current-password" required>
                    <button type="button" id="gPwToggle" aria-controls="gPw">Lihat</button>
                </div>
            </div>
            <div class="att-alert err g-hidden" id="gLoginErr" role="alert"></div>
            <button type="submit" class="att-btn att-btn-primary att-btn-block" id="gLoginBtn">Masuk</button>
        </form>
        <p class="att-muted g-login-foot">Lupa password? Hubungi admin sekolah untuk mengatur ulang.<br><a href="/">Kembali ke website sekolah</a></p>
    </section>

    <!-- Aplikasi -->
    <div id="gApp" class="g-hidden">
        <header class="g-top">
            <button type="button" class="g-back g-hidden" id="gBack" aria-label="Kembali">‹</button>
            <img id="gTopLogo" src="https://wwpbghdepykfqgzhyvmh.supabase.co/storage/v1/object/public/photos/logo-baru.png" alt="" onerror="this.style.visibility='hidden'">
            <div class="g-top-title"><b id="gTitle">Hari ini</b><span id="gSub"></span></div>
        </header>
        <main class="g-main" id="gMain" tabindex="-1"><div class="g-loading">Memuat…</div></main>
        <nav class="g-nav" aria-label="Menu guru">
            <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Hari ini</a>
            <a href="#/siswa" data-nav="siswa"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Siswa</a>
            <a href="#/rekap" data-nav="rekap"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Rekap</a>
            <a href="#/akun" data-nav="akun"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>Akun</a>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="attendance-sheet.js?v=1"></script>
    <script src="guru.js?v=1"></script>
</body>
</html>
