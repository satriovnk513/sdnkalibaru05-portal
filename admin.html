<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - SDN Kalibaru 05 Pagi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        body { background-color: #f8fafc; padding: 2rem; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .admin-header h1 { color: #da251c; font-family: 'Poppins', sans-serif; margin: 0; }
        .logout-btn { background: #64748b; color: white; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .tab-btn { padding: 0.75rem 1.5rem; background: white; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; font-weight: 600; color: #475569; }
        .tab-btn.active { background: #da251c; color: white; border-color: #da251c; }
        
        .tab-content { display: none; }
        
        .admin-container { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        .admin-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #1e293b; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Inter', sans-serif; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; font-weight: 600; }

        .btn-submit { width: 100%; background: #da251c; color: white; border: none; padding: 1rem; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: #b91c13; }
        .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }

        /* Login Overlay Styles */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8fafc; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { background: white; padding: 3rem 2rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-box input { width: 100%; padding: 0.75rem; margin: 1.5rem 0 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Inter', sans-serif; text-align: center; }
        .login-box button { width: 100%; background: #da251c; color: white; border: none; padding: 0.75rem; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .login-box button:hover { background: #b91c13; }
        .login-box .back-btn { display: block; width: 100%; background: #f1f5f9; color: #334155; text-decoration: none; padding: 0.75rem; border-radius: 8px; font-weight: bold; margin-top: 0.75rem; box-sizing: border-box; }
        #mainContent { display: none; }
    </style>
</head>

<body>
    <!-- Login Overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2 style="color: #da251c; font-family: 'Poppins', sans-serif; margin-bottom: 0.5rem;">Login Admin</h2>
            <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 1.5rem;">SDN Kalibaru 05</p>
            <input type="email" id="adminEmail" placeholder="Alamat Email" onkeypress="if(event.key === 'Enter') checkLogin()" style="margin-top: 0;">
            <input type="password" id="adminPassword" placeholder="Password" onkeypress="if(event.key === 'Enter') checkLogin()" style="margin-top: 0.5rem;">
            <button onclick="checkLogin()" style="margin-top: 1rem;">Masuk</button>
            <a href="index.html" class="back-btn">Kembali ke Beranda</a>
            <p id="loginError" style="color: #da251c; font-size: 0.85rem; margin-top: 1rem; display: none;">Email atau password salah!</p>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent">
        <div class="admin-header">
            <h1>Dashboard Admin</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('tabStaff')">Manajemen Guru & Staf (Otomatis)</button>
            <button class="tab-btn" onclick="showTab('tabNews')">Generator Berita (Manual)</button>
        </div>

        <!-- TAB STAFF -->
        <div id="tabStaff" class="tab-content" style="display: block;">
            <div class="admin-container">
                <div class="admin-card">
                    <h2 style="margin-bottom: 1.5rem; font-family: 'Poppins', sans-serif;">Tambah Guru/Staf</h2>
                    <form id="staffForm" onsubmit="saveStaff(event)">
                        <div class="form-group">
                            <label>Nama Lengkap (beserta gelar)</label>
                            <input type="text" id="staffName" required placeholder="Contoh: Budi Santoso, S.Pd.">
                        </div>
                        <div class="form-group">
                            <label>Kategori Jabatan Utama</label>
                            <select id="staffRole" onchange="updateSubRoles()" required>
                                <option value="Kepala Sekolah">Kepala Sekolah</option>
                                <option value="Guru Kelas">Guru Kelas</option>
                                <option value="Guru Mata Pelajaran">Guru Mata Pelajaran</option>
                                <option value="Tenaga Kependidikan">Tenaga Kependidikan</option>
                            </select>
                        </div>
                        <div class="form-group" id="subRoleGroup" style="display: none;">
                            <label>Spesifik Jabatan</label>
                            <select id="staffSubRole">
                                <option value="Kepala Sekolah">Kepala Sekolah</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>NIP / Keterangan Tambahan</label>
                            <input type="text" id="staffNip" placeholder="Contoh: NIP. 19880112 201001 1 002">
                        </div>
                        <div class="form-group">
                            <label>Upload Foto</label>
                            <input type="file" id="staffPhoto" accept="image/*">
                            <small style="color: #64748b; margin-top: 0.25rem; display: block;">Kosongkan jika tidak ada foto (akan pakai foto default).</small>
                        </div>
                        <button type="submit" class="btn-submit" id="saveStaffBtn">Simpan Data</button>
                    </form>
                </div>

                <div class="admin-card" style="overflow-x: auto;">
                    <h2 style="margin-bottom: 1.5rem; font-family: 'Poppins', sans-serif;">Daftar Guru & Staf</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Foto</th>
                                <th>Nama</th>
                                <th>Jabatan</th>
                                <th>NIP</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="staffTableBody">
                            <tr><td colspan="5">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB NEWS -->
        <div id="tabNews" class="tab-content">
            <div class="admin-container">
                <div class="admin-card">
                    <h2 style="margin-bottom: 1.5rem; font-family: 'Poppins', sans-serif;">Data Berita (Manual HTML)</h2>
                    <div class="form-group">
                        <label>Judul Berita</label>
                        <input type="text" id="newsTitle" oninput="generateHTML()">
                    </div>
                    <div class="form-group">
                        <label>Tanggal</label>
                        <input type="text" id="newsDate" oninput="generateHTML()">
                    </div>
                    <div class="form-group">
                        <label>URL Gambar</label>
                        <input type="text" id="newsImage" oninput="generateHTML()">
                    </div>
                    <div class="form-group">
                        <label>Cuplikan Berita</label>
                        <textarea id="newsDesc" oninput="generateHTML()"></textarea>
                    </div>
                </div>
                <div class="admin-card">
                    <h2 style="margin-bottom: 1.5rem; font-family: 'Poppins', sans-serif;">Kode HTML (Copy ini)</h2>
                    <div style="background: #1e293b; color: #e2e8f0; padding: 1.5rem; border-radius: 8px; font-family: monospace; white-space: pre-wrap; font-size: 0.9rem;" id="codeOutput"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Scripts -->
    <script src="admin.js"></script>
    <script>
        // News logic kept simple inline
        function generateHTML() {
            let title = document.getElementById('newsTitle').value || "Judul";
            let date = document.getElementById('newsDate').value || "Tanggal";
            let img = document.getElementById('newsImage').value || "https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=600&q=80";
            let desc = document.getElementById('newsDesc').value || "Deskripsi...";
            
            let code = `<article class="news-card animate-up">\n    <div class="news-img" style="background-image: url('${img}')"></div>\n    <div class="news-content">\n        <span class="news-date">${date}</span>\n        <h3 class="news-title">${title}</h3>\n        <p>${desc}</p>\n        <a href="#" class="read-more">Baca Selengkapnya <i class="fas fa-arrow-right"></i></a>\n    </div>\n</article>`;
            document.getElementById('codeOutput').innerText = code;
        }
        generateHTML();
    </script>
</body>
</html>
